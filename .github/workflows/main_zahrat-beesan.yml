# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install ALL dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React app
        run: |
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Create TINY release package (NO node_modules)
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          cd release && zip -r ../release.zip . && cd ..
          echo "Zip size:" && ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Set startup command and increase timeout
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG"
          
          echo "Removing conflicting settings..."
          az webapp config appsettings delete \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_DO_BUILD_DURING_DEPLOYMENT || true
          
          echo "Setting startup timeout to 900 seconds..."
          az webapp config appsettings set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --settings WEBSITES_CONTAINER_START_TIME_LIMIT=900
          
          echo "Setting SELF-HEALING startup command..."
          az webapp config set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --startup-file "npm install --omit=dev --legacy-peer-deps --no-audit --no-fund && node server.js"

      - name: Deploy tiny zip
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          SUB=$(az account show --query id -o tsv | tr -d '\r\n')
          
          az rest --method delete \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Web/sites/zahrat-beesan/deployments/latest?api-version=2022-03-01" || true
          
          sleep 5
          
          az webapp deploy \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --src-path release.zip \
            --type zip \
            --timeout 600 || true
          
          echo "Restarting to trigger npm install at startup..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"