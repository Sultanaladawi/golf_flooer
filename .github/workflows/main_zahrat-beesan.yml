# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        run: |
          npm install --legacy-peer-deps
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Create deployment zip
        run: |
          mkdir deploy_artifact
          cp -r build deploy_artifact/
          cp server.js deploy_artifact/
          cp package.json deploy_artifact/
          cp package-lock.json deploy_artifact/
          if [ -d "public" ]; then cp -r public deploy_artifact/; fi
          cd deploy_artifact
          npm install --legacy-peer-deps --omit=dev --ignore-scripts 2>&1 | tail -5
          cd ..
          cd deploy_artifact && zip -r ../release.zip . && cd ..
          echo "Zip size: $(du -sh release.zip)"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zahrat-beesan'
          slot-name: 'Production'
          package: release.zip
          startup-command: 'node server.js'