name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js
          node scripts/embed-html.js
          
          # Prepare ultra-fast minimal deployment package (<15MB)
          rm -rf deploy_stage build.zip
          # Bundle backend into 100% standalone single file with zero node_modules dependency
          npx esbuild main_server.js --bundle --platform=node --target=node22 --outfile=deploy_stage/main_server.js --external:mysql2/promise
          cat << 'EOF' > deploy_stage/package.json
          {"name":"zahrat-beesan","main":"main_server.js","scripts":{"start":"node main_server.js"}}
          EOF
          cp web.config deploy_stage/ 2>/dev/null || true
          cp .env.azure deploy_stage/ 2>/dev/null || true
          
          # Copy complete build folder (excluding heavy .mp4 videos)
          mkdir -p deploy_stage/build
          cp -r build/static deploy_stage/build/
          cp build/index.html deploy_stage/build/
          cp build/manifest.json deploy_stage/ 2>/dev/null || true
          cp build/favicon.ico deploy_stage/ 2>/dev/null || true
          cp build/logo.png deploy_stage/ 2>/dev/null || true
          
          cd deploy_stage && zip -r -q ../build.zip . && cd ..
          echo "Ultra-fast build.zip size: $(du -sh build.zip | cut -f1)"

      - name: Deploy to Azure Web App via Direct Linux ZipDeploy
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          node scripts/deploy-linux.js