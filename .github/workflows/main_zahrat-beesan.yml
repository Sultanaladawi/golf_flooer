name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js
          
          # Prepare build package with all images and public assets (excluding large videos)
          mkdir -p build_stage
          cp -r build/* build_stage/
          cp -r public/* build_stage/ || true
          find build_stage -type f \( -name "*.mp4" -o -name "*.mov" -o -name "*.webm" -o -name "*.avi" -o -name "*.m4v" \) -delete
          cd build_stage && zip -r -q ../build.zip * && cd ..
          echo "build.zip size: $(du -sh build.zip | cut -f1)"

      - name: Bundle server.js and prepare release files
        run: |
          node scripts/embed-html.js
          mkdir -p release
          npx --yes esbuild server.js --bundle --platform=node --target=node20 --outfile=release/server.js --external:canvas
          cp package.json release/
          echo "release/server.js size: $(du -sh release/server.js | cut -f1)"

      - name: Deploy to Azure Web App via Direct VFS Upload
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          node scripts/azure-deploy.js