# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Prepare complete production release package
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          cd release
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          zip -r ../release.zip .
          cd ..
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Deploy DIRECTLY via Kudu ZipDeploy using cURL
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Target Resource Group: $RG"
          
          echo "Stopping Web App to release file locks..."
          az webapp stop --name zahrat-beesan --resource-group "$RG"
          sleep 10
          
          echo "Extracting Kudu Publishing Profile credentials..."
          CREDS=$(az webapp deployment list-publishing-profiles --name zahrat-beesan --resource-group "$RG" --query "[?publishMethod=='ZipDeploy'].{user:userName, pass:userPWD}" -o json)
          
          USER=$(echo $CREDS | jq -r '.[0].user')
          PASS=$(echo $CREDS | jq -r '.[0].pass')
          
          echo "Uploading release.zip directly to Kudu ZipDeploy endpoint via cURL..."
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o deploy_response.txt -X POST -u "$USER:$PASS" --data-binary @"release.zip" "https://zahrat-beesan.scm.azurewebsites.net/api/zipdeploy")
          
          echo "Deployment HTTP Status: $HTTP_STATUS"
          cat deploy_response.txt
          
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "Direct cURL deployment failed."
            exit 1
          fi
          
          echo "Starting Web App..."
          az webapp start --name zahrat-beesan --resource-group "$RG"
          echo "Web app started successfully."