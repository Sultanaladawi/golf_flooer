name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js

      - name: Bundle server.js and prepare clean release ZIP
        run: |
          node scripts/embed-html.js
          mkdir -p release
          npx --yes esbuild server.js --bundle --platform=node --target=node20 --outfile=release/server.js --external:canvas
          cp package.json release/
          cp -r build release/
          find release/build -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webm" -o -name "*.mov" -o -name "*.gif" \) -delete
          cd release
          zip -r -q ../release.zip *
          cd ..
          echo "Release ZIP size: $(du -sh release.zip | cut -f1)"

      - name: Deploy to Azure Web App via Kudu curl
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          node -e "
          const fs = require('fs');
          const rawSecret = process.env.AZURE_WEBAPP_PUBLISH_PROFILE;
          const profileBlocks = rawSecret.match(/<publishProfile[\s\S]*?(?:\/>|>[\s\S]*?<\/publishProfile>)/gi) || [];
          const getAttr = (b, a) => { const m = b.match(new RegExp(a + '=\\\"([^\\\"]+)\\\"', 'i')); return m ? m[1] : null; };
          const block = profileBlocks.find(b => (getAttr(b, 'publishMethod') || '').toLowerCase() === 'msdeploy') || profileBlocks[0];
          const scmUrl = getAttr(block, 'publishUrl').replace(/^https?:\/\//i, '').replace(/:\d+$/, '').trim();
          const user = getAttr(block, 'userName');
          const pass = getAttr(block, 'userPWD');
          
          fs.writeFileSync('kudu_auth.env', 'SCM_HOST=' + scmUrl + '\nSCM_USER=' + user + '\nSCM_PASS=' + pass);
          "
          source kudu_auth.env
          echo "Deploying release.zip ($(du -sh release.zip | cut -f1)) directly to https://$SCM_HOST/api/zipdeploy ..."
          
          HTTP_STATUS=$(curl -s -o deploy_output.txt -w "%{http_code}" -X POST \
            -u "$SCM_USER:$SCM_PASS" \
            --data-binary "@release.zip" \
            -H "Content-Type: application/zip" \
            "https://$SCM_HOST/api/zipdeploy?isAsync=false")
          
          echo "ZipDeploy HTTP Status: $HTTP_STATUS"
          cat deploy_output.txt
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Deployment Succeeded via ZipDeploy!"
          else
            echo "Falling back to /api/zip/site/wwwroot/ ..."
            HTTP_STATUS_VFS=$(curl -s -o vfs_output.txt -w "%{http_code}" -X PUT \
              -u "$SCM_USER:$SCM_PASS" \
              --data-binary "@release.zip" \
              -H "Content-Type: application/zip" \
              "https://$SCM_HOST/api/zip/site/wwwroot/")
            echo "VFS HTTP Status: $HTTP_STATUS_VFS"
            cat vfs_output.txt
            if [ "$HTTP_STATUS_VFS" -ge 200 ] && [ "$HTTP_STATUS_VFS" -lt 300 ]; then
              echo "✅ VFS Deployment Succeeded!"
            else
              echo "❌ Deployment Failed"
              exit 1
            fi
          fi