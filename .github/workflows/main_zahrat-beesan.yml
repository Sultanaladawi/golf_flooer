# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install ALL dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React app
        run: |
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Create production package with node_modules
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          
          cd release
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          echo "Verifying express:"
          ls node_modules | grep express
          cd ..
          
          cd release
          zip -r ../release.zip .
          cd ..
          echo "Zip size:"
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Enable Basic Auth + Reset App Settings
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          SUBSCRIPTION=$(az account show --query id -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG | Subscription: $SUBSCRIPTION"
          
          echo "Enabling Basic Publishing Credentials (SCM auth)..."
          az resource update \
            --resource-group "$RG" \
            --resource-type "Microsoft.Web/sites/basicPublishingCredentialsPolicies" \
            --name "zahrat-beesan/scm" \
            --set "properties.allow=true" || true
          
          echo "Removing conflicting app settings..."
          az webapp config appsettings delete --name zahrat-beesan --resource-group "$RG" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_DO_BUILD_DURING_DEPLOYMENT || true
          
          echo "Ensuring app is RUNNING..."
          az webapp start --name zahrat-beesan --resource-group "$RG"
          sleep 20

      - name: Deploy via Direct Kudu REST API (clean=true)
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          
          CREDS=$(az webapp deployment list-publishing-credentials \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --query "{user: publishingUserName, pass: publishingPassword}" \
            -o json)
          KUDU_USER=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['user'])")
          KUDU_PASS=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['pass'])")
          
          echo "Testing Kudu connectivity..."
          curl -f -s -o /dev/null \
            "https://zahrat-beesan.scm.azurewebsites.net/api/settings" \
            --user "$KUDU_USER:$KUDU_PASS" \
            --connect-timeout 30 && echo "Kudu is REACHABLE!" || echo "Kudu not reachable via Basic Auth"
          
          echo "Deploying via Kudu REST API with clean=true..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://zahrat-beesan.scm.azurewebsites.net/api/zipdeploy?isAsync=false&clean=true" \
            --user "$KUDU_USER:$KUDU_PASS" \
            --max-time 600 \
            --connect-timeout 60 \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.zip)
          
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/deploy_response.txt
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "204" ]; then
            echo "SUCCESS! Deployment completed."
          else
            echo "Kudu Basic Auth failed, trying alternative approach via az webapp deploy..."
            az webapp deploy \
              --name zahrat-beesan \
              --resource-group "$RG" \
              --src-path release.zip \
              --type zip \
              --async false
          fi