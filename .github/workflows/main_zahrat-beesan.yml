# Deploy to Azure via FTP (direct, reliable, no API conflicts)

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Bundle server.js and prepare release folder
        run: |
          mkdir -p release
          npx --yes esbuild server.js --bundle --platform=node --target=node20 --outfile=release/server.js --external:canvas
          cp -r build release/
          cp package.json release/
          find release/build -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webm" -o -name "*.mov" -o -name "*.gif" \) -delete
          cd release && zip -r ../release.zip . && cd ..
          echo "ZIP size: $(du -sh release.zip | cut -f1)"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Get publish profile credentials
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "RG=$RG" >> $GITHUB_ENV
          CREDS=$(az webapp deployment list-publishing-credentials \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --output json)
          FTP_URL=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ftpsUri'])")
          FTP_USER=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['publishingUserName'])")
          FTP_PWD=$(echo "$CREDS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['publishingPassword'])")
          echo "FTP_URL=$FTP_URL" >> $GITHUB_ENV
          echo "FTP_USER=$FTP_USER" >> $GITHUB_ENV
          echo "::add-mask::$FTP_PWD"
          echo "FTP_PWD=$FTP_PWD" >> $GITHUB_ENV
          echo "Got FTP credentials."

      - name: Deploy via Kudu REST API zipdeploy
        run: |
          echo "Deploying via Kudu zipdeploy..."
          KUDU_URL="https://zahrat-beesan.scm.azurewebsites.net/api/zipdeploy?isAsync=false&clean=true"
          HTTP=$(curl -v -s -w "\n%{http_code}" \
            --max-time 300 \
            -X POST \
            -u "${FTP_USER}:${FTP_PWD}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.zip \
            "$KUDU_URL" 2>&1)
          echo "$HTTP"
          CODE=$(echo "$HTTP" | tail -1)
          echo "HTTP Status: $CODE"
          if [ "$CODE" = "200" ] || [ "$CODE" = "202" ] || [ "$CODE" = "204" ]; then
            echo "Deployment SUCCESSFUL!"
          else
            echo "ERROR: Deployment returned status $CODE"
            exit 1
          fi