name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js
          node scripts/embed-html.js
          
          # Prepare ultra-fast lightweight deployment package (8MB vs 650MB)
          rm -rf deploy_stage build.zip
          mkdir -p deploy_stage
          cp server.js deploy_stage/
          cp app.js deploy_stage/
          cp web.config deploy_stage/
          cp package.json deploy_stage/
          cp build/index.html deploy_stage/
          cp build/manifest.json deploy_stage/ 2>/dev/null || true
          cp build/favicon.ico deploy_stage/ 2>/dev/null || true
          cp build/logo.png deploy_stage/ 2>/dev/null || true
          cp -r build/static deploy_stage/
          cp -r build/portfolio deploy_stage/ 2>/dev/null || true
          
          # Mirror build and release directories for fallback resolution
          mkdir -p deploy_stage/build
          cp build/index.html deploy_stage/build/
          cp -r build/static deploy_stage/build/
          mkdir -p deploy_stage/release
          cp server.js deploy_stage/release/server.js
          
          # Write AI keys env file for Azure (environment variables may not be set in App Settings)
          cat > deploy_stage/.env.azure << 'ENVEOF'
OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
SMTP_USER=zahratbeesanshop@gmail.com
SMTP_PASS=${{ secrets.GMAIL_APP_PASSWORD }}
STORE_EMAIL=zahratbeesanshop@gmail.com
ENVEOF
          
          cd deploy_stage && zip -r -q ../build.zip . && cd ..
          echo "Ultra-fast build.zip size: $(du -sh build.zip | cut -f1)"

      - name: Deploy to Azure Web App via Kudu ZipDeploy with App Offline Unlock
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STORE_EMAIL: zahratbeesanshop@gmail.com
          SMTP_USER: zahratbeesanshop@gmail.com
        run: |
          node scripts/azure-deploy.js