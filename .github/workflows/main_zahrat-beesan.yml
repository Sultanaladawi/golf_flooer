name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js
          node scripts/embed-html.js
          
          # Prepare unified lightweight deployment package
          mkdir -p deploy_stage
          cp server.js deploy_stage/
          cp package.json deploy_stage/
          cp -r build/* deploy_stage/
          mkdir -p deploy_stage/build
          cp -r build/* deploy_stage/build/
          
          # Remove large video files from zip (they will be streamed separately or cached)
          find deploy_stage -type f \( -name "*.mp4" -o -name "*.mov" -o -name "*.webm" -o -name "*.avi" -o -name "*.m4v" \) -delete || true
          
          cd deploy_stage && zip -r -q ../build.zip . && cd ..
          echo "Optimized build.zip size: $(du -sh build.zip | cut -f1)"

          # Prepare videos package with all abaya product videos
          mkdir -p videos_stage
          find public -maxdepth 2 -type f \( -name "*.mp4" -o -name "*.mov" -o -name "*.webm" \) -exec cp {} videos_stage/ \; || true
          cd videos_stage && zip -r -q ../videos.zip * && cd ..
          echo "videos.zip size: $(du -sh videos.zip | cut -f1)"

      - name: Deploy to Azure Web App via Direct VFS Upload
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          node scripts/azure-deploy.js