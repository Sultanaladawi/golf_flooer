name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Bundle server.js and prepare lean release ZIP
        run: |
          mkdir -p release
          npx --yes esbuild server.js --bundle --platform=node --target=node20 --outfile=release/server.js --external:canvas
          cp -r build release/
          cp package.json release/
          find release/build -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webm" -o -name "*.mov" -o -name "*.gif" \) -delete
          cd release && zip -r ../release.zip . && cd ..
          echo "ZIP size: $(du -sh release.zip | cut -f1)"

      - name: Extract credentials from publish profile and deploy via Kudu
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          echo "$PUBLISH_PROFILE" > /tmp/profile.xml
          echo "--- Profile preview (first 200 chars) ---"
          head -c 200 /tmp/profile.xml

          # Extract SCM URL, username, and password from publish profile
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import os

          with open('/tmp/profile.xml', 'r') as f:
              content = f.read()

          tree = ET.fromstring(content)
          profiles = tree.findall('publishProfile')
          
          msdeploy = None
          for p in profiles:
              if p.get('publishMethod') == 'MSDeploy':
                  msdeploy = p
                  break
          
          if not msdeploy:
              print("ERROR: No MSDeploy profile found!")
              print("Available profiles:")
              for p in profiles:
                  print(f"  - {p.get('publishMethod')}: {p.get('publishUrl')}")
              exit(1)
          
          scm_url = msdeploy.get('publishUrl')
          username = msdeploy.get('userName')
          password = msdeploy.get('userPWD')
          
          print(f"SCM URL: {scm_url}")
          print(f"Username: {username}")
          
          with open('/tmp/kudu_creds.sh', 'w') as f:
              f.write(f'export SCM_URL="{scm_url}"\n')
              f.write(f'export SCM_USER="{username}"\n')
              f.write(f'export SCM_PWD="{password}"\n')
          PYEOF

          source /tmp/kudu_creds.sh
          echo "::add-mask::$SCM_PWD"
          echo "SCM URL: $SCM_URL"
          echo "Username: $SCM_USER"

          # Build full Kudu zipdeploy URL
          KUDU_URL="https://${SCM_URL}/api/zipdeploy?isAsync=false&clean=true"
          echo "Deploying to: $KUDU_URL"

          HTTP_CODE=$(curl -s -o /tmp/deploy_out.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -u "${SCM_USER}:${SCM_PWD}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.zip \
            "$KUDU_URL")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/deploy_out.txt || true

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "Deployment SUCCESSFUL!"
          else
            echo "Deployment FAILED with HTTP $HTTP_CODE"
            exit 1
          fi