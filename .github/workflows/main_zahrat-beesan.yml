# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Bundle server.js and create lean release ZIP (code only, no heavy media)
        run: |
          mkdir -p release
          echo "Bundling server.js into standalone single file..."
          npx --yes esbuild server.js --bundle --platform=node --target=node20 --outfile=release/server.js --external:canvas
          cp -r build release/
          cp package.json release/
          echo "Removing heavy media files to keep ZIP under Azure 100MB limit..."
          find release/build -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webm" -o -name "*.mov" -o -name "*.gif" \) -delete
          echo "Zipping lean release..."
          cd release && zip -r ../release.zip . && cd ..
          echo "Lean Release ZIP size:"
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: CRITICAL - Remove WEBSITE_RUN_FROM_PACKAGE lock and restart app
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG"

          echo "=== Step 1: Delete WEBSITE_RUN_FROM_PACKAGE setting completely ==="
          az webapp config appsettings delete \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE || echo "Setting may not exist, continuing..."

          echo "=== Step 2: Also explicitly set it to empty string ==="
          az webapp config appsettings set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --settings WEBSITE_RUN_FROM_PACKAGE=""

          echo "=== Step 3: Set startup file ==="
          az webapp config set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --startup-file "node server.js"

          echo "=== Step 4: STOP the app to release file locks ==="
          az webapp stop --name zahrat-beesan --resource-group "$RG"
          echo "App stopped. Waiting 10s for locks to release..."
          sleep 10

          echo "=== Step 5: Verify settings before deploy ==="
          az webapp config appsettings list \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE']" -o table

          echo "Ready for deployment."

      - name: Deploy lean ZIP to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zahrat-beesan'
          package: 'release.zip'

      - name: Start app and upload media files
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')

          echo "Starting app..."
          az webapp start --name zahrat-beesan --resource-group "$RG"

          echo "Uploading media files individually..."
          MEDIA_COUNT=0
          for f in $(find build -type f \( -name "*.png" -o -name "*.mp4" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webm" -o -name "*.mov" -o -name "*.gif" \) | head -100); do
            REL_PATH="${f#build/}"
            az webapp deploy \
              --name zahrat-beesan \
              --resource-group "$RG" \
              --src-path "$f" \
              --target-path "/home/site/wwwroot/build/$REL_PATH" \
              --type static \
              --async true 2>/dev/null || true
            MEDIA_COUNT=$((MEDIA_COUNT+1))
          done
          echo "Sent $MEDIA_COUNT media files."