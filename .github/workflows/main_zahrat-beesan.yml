# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Prepare complete production release package
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          cd release
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          zip -r ../release.zip .
          cd ..
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Neutralize File Locks (Change Startup Command)
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Target Resource Group: $RG"
          echo "Setting startup command to 'sleep 3600' to prevent Node.js from locking files..."
          az webapp config set --name zahrat-beesan --resource-group "$RG" --startup-file "sleep 3600"
          echo "Restarting app to apply neutral startup command..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"
          echo "Waiting 20 seconds for container to restart without file locks..."
          sleep 20

      - name: Deploy release.zip via official action (No File Locks!)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zahrat-beesan'
          slot-name: 'Production'
          package: 'release.zip'

      - name: Restore Application (Revert Startup Command)
        if: always()
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Restoring original startup command..."
          az webapp config set --name zahrat-beesan --resource-group "$RG" --startup-file "node server.js"
          echo "Restarting app to launch Node.js..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"
          echo "Application is back online."