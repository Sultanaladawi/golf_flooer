# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Prepare ultra-light release package (NO node_modules)
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          cd release
          # DO NOT RUN npm install here! We want a tiny ZIP file.
          zip -r ../release.zip .
          cd ..
          echo "Zip file size:"
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Enable Oryx Build and Wake Up App Service
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Target Resource Group: $RG"
          
          echo "Enabling SCM_DO_BUILD_DURING_DEPLOYMENT so Kudu runs npm install..."
          az webapp config appsettings set --name zahrat-beesan --resource-group "$RG" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
          
          # We must ensure WEBSITE_RUN_FROM_PACKAGE is OFF so Oryx can build
          az webapp config appsettings delete --name zahrat-beesan --resource-group "$RG" --setting-names WEBSITE_RUN_FROM_PACKAGE || true
          
          echo "Ensuring App Service is RUNNING so Kudu is awake to receive the tiny ZIP..."
          az webapp start --name zahrat-beesan --resource-group "$RG"
          sleep 10

      - name: Deploy lightweight release.zip via Azure CLI (Direct Kudu ZipDeploy)
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Deploying tiny release.zip. Kudu will run npm install internally!"
          az webapp deployment source config-zip --name zahrat-beesan --resource-group "$RG" --src release.zip

      - name: Restart App Service
        if: always()
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Restarting the App Service to apply changes..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"