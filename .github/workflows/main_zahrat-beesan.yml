# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install ALL dependencies (frontend + backend)
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React app
        run: |
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Create production package with node_modules
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          
          echo "Installing PRODUCTION-ONLY node_modules into release folder..."
          cd release
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          echo "Verifying express is present:"
          ls node_modules | grep express
          cd ..
          
          echo "Creating zip..."
          cd release
          zip -r ../release.zip .
          cd ..
          echo "Zip size:"
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Reset settings and ensure app is RUNNING
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG"
          
          echo "Removing conflicting settings..."
          az webapp config appsettings delete --name zahrat-beesan --resource-group "$RG" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_DO_BUILD_DURING_DEPLOYMENT || true
          
          echo "Ensuring app is STARTED (Kudu must be alive to accept the zip)..."
          az webapp start --name zahrat-beesan --resource-group "$RG"
          sleep 15

      - name: Get Publish Credentials for Direct Kudu Access
        id: creds
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          # Get publishing credentials directly - these bypass ARM/OneDeploy entirely
          CREDS=$(az webapp deployment list-publishing-credentials \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --query "{user: publishingUserName, pass: publishingPassword}" \
            -o json)
          KUDU_USER=$(echo $CREDS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['user'])")
          KUDU_PASS=$(echo $CREDS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['pass'])")
          echo "kudu_user=$KUDU_USER" >> $GITHUB_OUTPUT
          echo "::add-mask::$KUDU_PASS"
          echo "kudu_pass=$KUDU_PASS" >> $GITHUB_OUTPUT

      - name: Deploy via Direct Kudu REST API (clean=true to bypass ALL file locks)
        run: |
          KUDU_USER="${{ steps.creds.outputs.kudu_user }}"
          KUDU_PASS="${{ steps.creds.outputs.kudu_pass }}"
          
          echo "Deploying via Kudu REST API with clean=true to wipe existing files first..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            "https://zahrat-beesan.scm.azurewebsites.net/api/zipdeploy?isAsync=false&clean=true" \
            --user "$KUDU_USER:$KUDU_PASS" \
            --max-time 600 \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.zip)
          
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/deploy_response.txt
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "Deployment failed with status $HTTP_STATUS"
            exit 1
          fi
          
          echo "Deployment successful!"