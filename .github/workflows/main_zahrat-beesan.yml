name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js
          node scripts/embed-html.js
          
          # Prepare ultra-fast minimal deployment package (<15MB)
          rm -rf deploy_stage build.zip
          mkdir -p deploy_stage
          cp main_server.js deploy_stage/
          cp server_bundled.js deploy_stage/
          cp server.js deploy_stage/
          cp app.js deploy_stage/
          cp web.config deploy_stage/ 2>/dev/null || true
          cp .env.azure deploy_stage/ 2>/dev/null || true
          
          # Create dedicated server package.json with ONLY runtime backend dependencies
          cat << 'EOF' > deploy_stage/package.json
          {
            "name": "zahrat-beesan-server",
            "version": "1.0.0",
            "main": "main_server.js",
            "scripts": { "start": "node main_server.js" },
            "dependencies": {
              "express": "^5.2.1",
              "cors": "^2.8.6",
              "dotenv": "^17.4.2",
              "mysql2": "^3.22.2",
              "nodemailer": "^9.0.3",
              "compression": "^1.8.1",
              "multer": "^2.1.1",
              "stripe": "^22.3.2",
              "openai": "^6.34.0",
              "@google/generative-ai": "^0.24.1",
              "node-cron": "^4.6.0"
            }
          }
          EOF
          
          # Install lightweight production dependencies (installs in 5 seconds)
          (cd deploy_stage && npm install --omit=dev --no-audit --no-fund)
          
          # Copy complete build folder
          mkdir -p deploy_stage/build
          cp -r build/static deploy_stage/build/
          cp build/index.html deploy_stage/build/
          cp -r build/static deploy_stage/
          cp build/index.html deploy_stage/
          cp build/manifest.json deploy_stage/ 2>/dev/null || true
          cp build/favicon.ico deploy_stage/ 2>/dev/null || true
          cp build/logo.png deploy_stage/ 2>/dev/null || true
          
          cd deploy_stage && zip -r -q ../build.zip . && cd ..
          echo "Ultra-fast build.zip size: $(du -sh build.zip | cut -f1)"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zahrat-beesan'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./build.zip