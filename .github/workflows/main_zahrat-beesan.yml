name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          node scripts/create-aliases.js
          node scripts/embed-html.js
          node scripts/insert-tap-clean.js
          
          # Prepare ultra-fast minimal deployment package (<15MB)
          mkdir -p deploy_stage
          cp main_server.js deploy_stage/server_v2.js
          cp main_server.js deploy_stage/main_server.js
          cp main_server.js deploy_stage/server.js
          cat << 'EOF' > deploy_stage/package.json
          {"name":"zahrat-beesan","main":"server_v2.js","scripts":{"start":"node server_v2.js"}}
          EOF
          cp web.config deploy_stage/ 2>/dev/null || true
          echo "<!-- Azure Reload Trigger: $(date +%s) -->" >> deploy_stage/web.config
          cp .env.azure deploy_stage/ 2>/dev/null || true
          
          # Copy complete build folder to BOTH root and build/ subfolder
          mkdir -p deploy_stage/build deploy_stage/public deploy_stage/scripts deploy_stage/server deploy_stage/data/labels
          cp -r server/* deploy_stage/server/ 2>/dev/null || true
          cp server/tapRoutes.js deploy_stage/server/tapRoutes.js 2>/dev/null || true
          cp -r build/static deploy_stage/build/
          cp build/index.html deploy_stage/build/
          cp -r build/static deploy_stage/
          cp build/index.html deploy_stage/
          cp build/manifest.json deploy_stage/ 2>/dev/null || true
          cp build/favicon.ico deploy_stage/ 2>/dev/null || true
          cp build/logo.png deploy_stage/ 2>/dev/null || true
          cp build/Zahrat_Beesan_Catalog_2026.pdf deploy_stage/build/ 2>/dev/null || true
          cp public/Zahrat_Beesan_Catalog_2026.pdf deploy_stage/public/ 2>/dev/null || true
          cp public/Zahrat_Beesan_Catalog_2026.pdf deploy_stage/ 2>/dev/null || true
          cp scripts/generate-sample-catalog.js deploy_stage/scripts/ 2>/dev/null || true
          
          cd deploy_stage && zip -r -q ../build.zip . && cd ..
          echo "Ultra-fast build.zip size: $(du -sh build.zip | cut -f1)"

      - name: Deploy to Azure Web App via Bulletproof FTPS
        timeout-minutes: 5
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          npm install basic-ftp --no-save --no-audit --no-fund
          node scripts/ftp-deploy.js || node scripts/fast-deploy.js