# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Bundle server.js into 100% standalone single file (ZERO external modules)
        run: |
          mkdir -p release
          echo "Bundling EVERYTHING into standalone release/server.js..."
          npx --yes esbuild server.js --bundle --platform=node --target=node20 --outfile=release/server.js --external:canvas
          
          cp -r build release/
          cp package.json release/
          
          cd release
          zip -r ../release.zip .
          cd ..
          echo "100% Ultra-Lightweight Standalone release.zip created! Size:"
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Configure Azure App Settings and Startup
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG"
          
          echo "Enabling WEBSITE_RUN_FROM_PACKAGE=1 for atomic package execution..."
          az webapp config appsettings set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --settings WEBSITE_RUN_FROM_PACKAGE="1"
          
          echo "Setting startup file to node server.js..."
          az webapp config set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --startup-file "node server.js"

      - name: Deploy to Azure Web App via official Action
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zahrat-beesan'
          package: 'release.zip'