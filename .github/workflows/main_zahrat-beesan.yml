# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Docker container to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build
          echo "React build complete."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zahrat-beesan:latest
            ghcr.io/${{ github.repository_owner }}/zahrat-beesan:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Configure App Service to use Docker image from GHCR
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG"
          
          IMAGE="ghcr.io/${{ github.repository_owner }}/zahrat-beesan:latest"
          echo "Configuring App Service to use image: $IMAGE"
          
          # Remove old deployment settings
          az webapp config appsettings delete \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_DO_BUILD_DURING_DEPLOYMENT || true
          
          # Configure container settings
          az webapp config container set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://ghcr.io" \
            --container-registry-user "${{ github.actor }}" \
            --container-registry-password "${{ secrets.GITHUB_TOKEN }}"
          
          echo "Restarting app to pull new Docker image..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"
          echo "Done! App will pull and run the new Docker image."