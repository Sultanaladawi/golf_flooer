# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies and build React app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Prepare ultra-light release package (NO node_modules)
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          cd release
          # NO npm install here! We want a tiny ZIP file.
          zip -r ../release.zip .
          cd ..
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: Break Crash Loop and Enable Oryx Build
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Target Resource Group: $RG"
          
          echo "Setting SCM_DO_BUILD_DURING_DEPLOYMENT to true..."
          az webapp config appsettings set --name zahrat-beesan --resource-group "$RG" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true WEBSITE_RUN_FROM_PACKAGE=""
          
          echo "Changing startup command to 'sleep 3600' to KILL the rapid crash loop of node server.js..."
          az webapp config set --name zahrat-beesan --resource-group "$RG" --startup-file "sleep 3600"
          
          echo "Restarting app to apply the sleep command..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"
          
          echo "Waiting 60 seconds for the container to fully reboot and for all file locks to be dropped..."
          sleep 60

      - name: Deploy tiny release.zip via Azure CLI
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Deploying tiny zip. Oryx will run npm install internally!"
          az webapp deployment source config-zip --name zahrat-beesan --resource-group "$RG" --src release.zip

      - name: Restore Application Startup Command
        if: always()
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Restoring startup command to 'node server.js'..."
          az webapp config set --name zahrat-beesan --resource-group "$RG" --startup-file "node server.js"
          
          echo "Restarting the App Service to bring the app back online..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"