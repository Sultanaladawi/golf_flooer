# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zahrat-beesan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install ALL dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React app
        run: |
          CI=false GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Create production package with node_modules
        run: |
          mkdir -p release
          cp -r build release/
          cp server.js release/
          cp package.json release/
          cp package-lock.json release/
          if [ -d "public" ]; then cp -r public release/; fi
          
          cd release
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          echo "Verifying express:"
          ls node_modules | grep express
          cd ..
          
          cd release
          zip -r ../release.zip .
          cd ..
          echo "Zip size:"
          ls -lh release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_585F90221B624AC1ABEA1B169BFE9B9A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F6440EECBFD42D8A6DF18EDC929C765 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_93F91F608C034306A9F9DE16A772F388 }}

      - name: STEP 1 - Switch to crash-proof startup (releases ALL file locks)
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          echo "Resource Group: $RG"
          
          echo "Removing all conflicting settings..."
          az webapp config appsettings delete \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE SCM_DO_BUILD_DURING_DEPLOYMENT || true
          
          echo "Setting crash-proof startup command (uses ONLY built-in Node.js, zero file locks)..."
          az webapp config set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --startup-file "node -e \"const h=require('http');h.createServer((_,r)=>{r.writeHead(200);r.end('deploying');}).listen(process.env.PORT||8080,()=>console.log('ready'));\""
          
          echo "Restarting to apply crash-proof startup..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"
          
          echo "Waiting 45 seconds for the container to start fresh with zero crash loops..."
          sleep 45

      - name: STEP 2 - Deploy zip SYNCHRONOUSLY (no crash loop = no file locks)
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          SUB=$(az account show --query id -o tsv | tr -d '\r\n')
          
          echo "Clearing any OneDeploy lock from previous runs..."
          az rest \
            --method delete \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Web/sites/zahrat-beesan/deployments/latest?api-version=2022-03-01" || true
          
          sleep 5
          
          echo "Deploying release.zip SYNCHRONOUSLY (waiting for full extraction)..."
          az webapp deploy \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --src-path release.zip \
            --type zip \
            --async false \
            --timeout 600

      - name: STEP 3 - Restore real startup command
        if: always()
        run: |
          RG=$(az webapp list --query "[?name=='zahrat-beesan'].resourceGroup" -o tsv | tr -d '\r\n')
          
          echo "Restoring real startup command: node server.js"
          az webapp config set \
            --name zahrat-beesan \
            --resource-group "$RG" \
            --startup-file "node server.js"
          
          echo "Restarting app with the real startup command..."
          az webapp restart --name zahrat-beesan --resource-group "$RG"
          echo "Done! App should now be serving real content."